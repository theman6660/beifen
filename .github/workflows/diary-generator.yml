name: Diary Generator

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate the diary date carried by the private payload
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 14 * * *'

permissions: {}

concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  generate-diary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Check private dated snippet payload
        id: input
        env:
          DIARY_SNIPPETS_JSON: ${{ secrets.DIARY_SNIPPETS_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$DIARY_SNIPPETS_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::DIARY_SNIPPETS_JSON must contain {date, snippets}."
            exit 1
          fi

          echo "::notice::No DIARY_SNIPPETS_JSON secret is configured; skipping the scheduled diary run."
      - uses: actions/checkout@v6
        if: steps.input.outputs.available == 'true'
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        if: steps.input.outputs.available == 'true'
        with: { node-version: '22', cache: npm }
      - if: steps.input.outputs.available == 'true'
        run: npm ci
      - name: Sync latest source branch
        if: steps.input.outputs.available == 'true'
        run: git pull --ff-only origin main
      - name: Generate diary from private input
        if: steps.input.outputs.available == 'true'
        env:
          AUTH_TOKEN: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          MODEL: ${{ vars.MODEL || 'gemini-2.0-flash' }}
          DIARY_SNIPPETS_JSON: ${{ secrets.DIARY_SNIPPETS_JSON }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          args=()
          if [ "$FORCE_RUN" = "true" ]; then args+=(--force); fi
          node diary-generator.js "${args[@]}"
      - name: Commit diary only
        if: steps.input.outputs.available == 'true'
        id: commit
        run: |
          set -euo pipefail
          git add source/_posts/diary-*.md
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            date=$(git diff --cached --name-only | sed -n 's#source/_posts/diary-\([0-9-]*\)\.md#\1#p' | tail -1)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: 日记 ${date}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: generate-diary
    if: needs.generate-diary.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/_site-deploy.yml
    with:
      ref: main
      reason: diary ${{ needs.generate-diary.outputs.source_sha }}
    secrets: inherit
