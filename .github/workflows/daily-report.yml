name: Daily Report Pipeline

on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 3 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's posts even if they already exist"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.bj-date.outputs.date }}
      should_run: ${{ steps.guard.outputs.should_run }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Pin latest source branch
        id: source
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          source_sha="$(git rev-parse refs/remotes/origin/main)"
          git checkout --detach "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Compute Beijing date once
        id: bj-date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Decide whether to generate
        id: guard
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
          DATE: ${{ steps.bj-date.outputs.date }}
        run: |
          set -euo pipefail
          ai="source/_posts/ai-daily-$DATE.md"
          society="source/_posts/society-daily-$DATE.md"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$ai" ] && [ -f "$society" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today's source posts already exist; watchdog will independently verify the live deployment."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  ai-daily:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Generate AI Daily
        env:
          AUTH_TOKEN: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          MODEL: ${{ vars.MODEL || 'gemini-2.0-flash' }}
          BJ_DATE: ${{ needs.preflight.outputs.date }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          CHRONICLE_ENTRY_FILE: .local-artifacts/ai-chronicle-entry.md
        run: |
          args=(--no-deploy)
          if [ "$FORCE_RUN" = "true" ]; then args+=(--force); fi
          node ai-daily.js "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-posts
          path: source/_posts/ai-daily-${{ needs.preflight.outputs.date }}.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ai-chronicle-entry
          path: .local-artifacts/ai-chronicle-entry.md
          if-no-files-found: warn

  society-daily:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Generate Society Daily
        env:
          AUTH_TOKEN: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.AUTH_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          MODEL: ${{ vars.MODEL || 'gemini-2.0-flash' }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          BJ_DATE: ${{ needs.preflight.outputs.date }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          args=(--no-deploy)
          if [ "$FORCE_RUN" = "true" ]; then args+=(--force); fi
          node society-daily.js "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: society-posts
          path: source/_posts/society-daily-${{ needs.preflight.outputs.date }}.md
          if-no-files-found: error

  commit-source:
    needs: [preflight, ai-daily, society-daily]
    if: always() && !cancelled() && needs.preflight.outputs.should_run == 'true' && needs.ai-daily.result == 'success' && needs.society-daily.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Refuse artifacts generated from stale source
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$SOURCE_SHA" ]; then
            echo "::error::checkout resolved to $actual_sha instead of pinned source $SOURCE_SHA."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "::error::origin/main advanced from $SOURCE_SHA to $current_sha; refusing stale generated artifacts."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: ai-posts, path: source/_posts/ }
      - uses: actions/download-artifact@v8
        with: { name: society-posts, path: source/_posts/ }
      - uses: actions/download-artifact@v8
        with: { name: ai-chronicle-entry, path: .local-artifacts/chronicle-entry/ }
        continue-on-error: true
      - name: Apply AI chronicle entry to latest source
        env:
          BJ_DATE: ${{ needs.preflight.outputs.date }}
        run: node tools/apply-chronicle-entry.js --entry .local-artifacts/chronicle-entry/ai-chronicle-entry.md --chronicle source/_posts/ai-chronicle.md
      - name: Validate generated source
        run: |
          test -s "source/_posts/ai-daily-${{ needs.preflight.outputs.date }}.md"
          test -s "source/_posts/society-daily-${{ needs.preflight.outputs.date }}.md"
          node tools/validate-daily-posts.js
      - name: Commit and push generated source
        id: commit
        env:
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          set -euo pipefail
          git add "source/_posts/ai-daily-$DATE.md" "source/_posts/society-daily-$DATE.md" source/_posts/ai-chronicle.md
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: 更新日报 $DATE"
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: commit-source
    if: needs.commit-source.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/_site-deploy.yml
    with:
      ref: main
      reason: daily report ${{ needs.commit-source.outputs.source_sha }}
    secrets: inherit
