name: Daily Report Watchdog

on:
  schedule:
    - cron: '32,47 0-12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-report-watchdog
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sync latest source branch
        run: |
          git fetch origin main
          git checkout --detach origin/main
      - name: Compare source posts with live deployment
        id: state
        run: |
          set -euo pipefail
          date=$(TZ=Asia/Shanghai date +%F)
          source_sha=$(git rev-parse HEAD)
          ai="source/_posts/ai-daily-$date.md"
          society="source/_posts/society-daily-$date.md"
          echo "date=$date" >> "$GITHUB_OUTPUT"

          if [ ! -f "$ai" ] || [ ! -f "$society" ]; then
            echo "action=generate" >> "$GITHUB_OUTPUT"
            echo "workflow=daily-report.yml" >> "$GITHUB_OUTPUT"
            echo "reason=source posts are incomplete for $date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          marker=$(curl -fsSL --max-time 15 "https://hanxiaofan.site/daily-report-status.json?watchdog=${GITHUB_RUN_ID}" || true)
          year=${date:0:4}; month=${date:5:2}; day=${date:8:2}
          marker_ok=false; ai_live=false; society_live=false
          if jq -e --arg date "$date" --arg sha "$source_sha" '.date == $date and .sourceCommit == $sha' <<<"$marker" >/dev/null 2>&1; then marker_ok=true; fi
          if curl -fsSL --max-time 15 -o /dev/null "https://hanxiaofan.site/${year}/${month}/${day}/ai-daily-${date}/"; then ai_live=true; fi
          if curl -fsSL --max-time 15 -o /dev/null "https://hanxiaofan.site/${year}/${month}/${day}/society-daily-${date}/"; then society_live=true; fi

          if [ "$marker_ok" = true ] && [ "$ai_live" = true ] && [ "$society_live" = true ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "workflow=" >> "$GITHUB_OUTPUT"
            echo "reason=source and live deployment are current" >> "$GITHUB_OUTPUT"
          else
            echo "action=redeploy" >> "$GITHUB_OUTPUT"
            echo "workflow=manual-site-redeploy.yml" >> "$GITHUB_OUTPUT"
            echo "reason=live deployment stale for $date marker=$marker_ok ai=$ai_live society=$society_live" >> "$GITHUB_OUTPUT"
          fi
      - name: Check active recovery runs
        id: active
        if: steps.state.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.state.outputs.action }}
          WORKFLOW: ${{ steps.state.outputs.workflow }}
        run: |
          set -euo pipefail
          count_runs() {
            local workflow=$1 status=$2
            gh run list --workflow "$workflow" --branch main --status "$status" --limit 20 --json databaseId --jq 'length'
          }
          total=$(( $(count_runs "$WORKFLOW" queued) + $(count_runs "$WORKFLOW" in_progress) ))
          if [ "$ACTION" = redeploy ]; then
            total=$(( total + $(count_runs daily-report.yml queued) + $(count_runs daily-report.yml in_progress) ))
          fi
          echo "count=$total" >> "$GITHUB_OUTPUT"
      - name: Dispatch source generation
        if: steps.state.outputs.action == 'generate' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-report.yml --ref main
      - name: Dispatch live redeploy
        if: steps.state.outputs.action == 'redeploy' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.state.outputs.reason }}
        run: |
          gh workflow run manual-site-redeploy.yml --ref main -f ref=main -f "reason=watchdog recovery: $REASON"
      - name: Report state
        env:
          ACTION: ${{ steps.state.outputs.action }}
          REASON: ${{ steps.state.outputs.reason }}
          ACTIVE: ${{ steps.active.outputs.count }}
        run: |
          echo "action=$ACTION active_runs=${ACTIVE:-0} reason=$REASON"
