name: Manual Site Redeploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to deploy: main, deploy-* tag, or commit SHA"
        required: true
        default: main
      reason:
        description: "Why redeploying or rolling back"
        required: false
        default: manual recovery
      confirm:
        description: "For non-main refs, type overwrite-pages to confirm replacing live Pages output"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_site-deploy.yml
    with:
      ref: ${{ inputs.ref }}
      reason: ${{ inputs.reason }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
